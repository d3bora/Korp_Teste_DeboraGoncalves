# nginx.conf
# API Gateway que roteia as requisições do frontend para os microsserviços corretos.
# /api/stock/*   → stock-service  (porta 8081)
# /api/billing/* → billing-service (porta 8082)

events {
  worker_connections 1024;
}

http {
  # ─── Configurações gerais ────────────────────────────────────────────────
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Timeout aumentado para operações longas (ex: impressão de NF)
  proxy_read_timeout 60s;
  proxy_connect_timeout 10s;

  # ─── Cabeçalhos CORS globais ─────────────────────────────────────────────
  map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:[0-9]+)?$" "$http_origin";
  }

  server {
    listen 80;
    server_name localhost;

    # ─── Rota: Microsserviço de Estoque ──────────────────────────────────
    location /api/stock/ {
      # Remove o prefixo /api/stock antes de repassar ao serviço
      rewrite ^/api/stock/(.*) /$1 break;

      proxy_pass         http://stock-service:8081;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;

      # CORS: permite chamadas do Angular em desenvolvimento
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    # ─── Rota: Microsserviço de Faturamento ──────────────────────────────
    location /api/billing/ {
      rewrite ^/api/billing/(.*) /$1 break;

      proxy_pass         http://billing-service:8082;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;

      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    # ─── Health Check do Gateway ──────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok","gateway":"nginx"}';
      add_header Content-Type application/json;
    }
  }
}
