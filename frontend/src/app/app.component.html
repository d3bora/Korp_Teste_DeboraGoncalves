<!-- app.component.html -->
<!-- Layout raiz: navbar fixa + barra de loading global + router-outlet -->

<!-- Navbar principal -->
<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon class="app-logo">receipt_long</mat-icon>
  <span class="app-title">Sistema de Notas Fiscais</span>

  <span class="spacer"></span>

  <!-- Links de navegação -->
  <a mat-button
     routerLink="/products"
     routerLinkActive="nav-active"
     id="nav-products">
    <mat-icon>inventory_2</mat-icon>
    Produtos
  </a>

  <a mat-button
     routerLink="/invoices"
     routerLinkActive="nav-active"
     id="nav-invoices">
    <mat-icon>receipt</mat-icon>
    Notas Fiscais
  </a>
</mat-toolbar>

<!-- Barra de progresso global — aparece durante qualquer requisição HTTP -->
<!-- Usa async pipe para se inscrever no Observable do LoadingService -->
<mat-progress-bar
  *ngIf="isLoading$ | async"
  mode="indeterminate"
  class="global-loading-bar">
</mat-progress-bar>

<!-- Conteúdo das páginas injetado aqui pelo roteador -->
<main class="app-content">
  <router-outlet></router-outlet>
</main>
