<!-- product-form.component.html -->
<!-- Modal de criação/edição de produto com validação em tempo real -->
<h2 mat-dialog-title>
  <mat-icon>{{ isEditMode ? 'edit' : 'add_circle' }}</mat-icon>
  {{ title }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" id="product-form">

    <!-- Campo: Código (somente leitura em modo edição) -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Código</mat-label>
      <input matInput formControlName="code"
             id="input-product-code"
             placeholder="Ex: PROD001"
             maxlength="20" />
      <mat-hint *ngIf="isEditMode">O código não pode ser alterado</mat-hint>
      <mat-error *ngIf="form.get('code')?.hasError('required')">
        Código é obrigatório
      </mat-error>
    </mat-form-field>

    <!-- Campo: Descrição -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="description"
             id="input-product-description"
             placeholder="Nome do produto"
             maxlength="100" />
      <mat-error *ngIf="form.get('description')?.hasError('required')">
        Descrição é obrigatória
      </mat-error>
    </mat-form-field>

    <!-- Campo: Saldo -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Saldo em Estoque</mat-label>
      <input matInput type="number" formControlName="balance"
             id="input-product-balance"
             min="0" />
      <mat-error *ngIf="form.get('balance')?.hasError('min')">
        O saldo não pode ser negativo
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" id="btn-cancel-product-form">
    Cancelar
  </button>
  <button mat-flat-button color="primary"
          (click)="onSubmit()"
          [disabled]="form.invalid || isSubmitting"
          id="btn-submit-product-form">
    {{ isSubmitting ? 'Salvando...' : 'Salvar' }}
  </button>
</mat-dialog-actions>
