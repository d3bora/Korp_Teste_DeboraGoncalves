<!-- product-list.component.html -->
<!-- Página principal de Cadastro de Produtos -->
<div class="page-container">

  <!-- Cabeçalho da página -->
  <div class="page-header">
    <div class="page-title">
      <h1>Cadastro de Produtos</h1>
      <span class="page-subtitle">Gerencie o estoque de produtos disponíveis</span>
    </div>
    <button mat-flat-button color="primary" (click)="openCreateDialog()" id="btn-create-product">
      <mat-icon>add</mat-icon>
      Novo Produto
    </button>
  </div>

  <!-- Tabela de produtos (MatTable) -->
  <div class="table-container mat-elevation-z2">
    <table mat-table [dataSource]="products" class="full-width">

      <!-- Coluna: Código -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let product">
          <span class="code-badge">{{ product.code }}</span>
        </td>
      </ng-container>

      <!-- Coluna: Descrição -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let product">{{ product.description }}</td>
      </ng-container>

      <!-- Coluna: Saldo em estoque com alerta visual -->
      <ng-container matColumnDef="balance">
        <th mat-header-cell *matHeaderCellDef>Saldo em Estoque</th>
        <td mat-cell *matCellDef="let product">
          <span [class]="'balance-chip ' + getBalanceClass(product.balance)">
            {{ product.balance }} unidade(s)
          </span>
        </td>
      </ng-container>

      <!-- Coluna: Ações (editar / excluir) -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary"
                  matTooltip="Editar produto"
                  (click)="openEditDialog(product)"
                  [id]="'btn-edit-product-' + product.id">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn"
                  matTooltip="Excluir produto"
                  (click)="deleteProduct(product)"
                  [id]="'btn-delete-product-' + product.id">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Linha exibida quando não há produtos -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" colspan="4">
          <mat-icon>inventory_2</mat-icon>
          <p>Nenhum produto cadastrado. Clique em "Novo Produto" para começar.</p>
        </td>
      </tr>

    </table>
  </div>
</div>
